app = "relatos-catalogue"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8081"
  SERVER_PORT = "8081"
  EUREKA_ENABLED = "true"
  OPENSEARCH_PORT = "443"
  OPENSEARCH_SCHEME = "https"
  OPENSEARCH_INDEX = "books"

# Los secretos (OPENSEARCH_HOST, OPENSEARCH_USERNAME, OPENSEARCH_PASSWORD, EUREKA_URL)
# se configuran con: fly secrets set VARIABLE=valor

[http_service]
  internal_port = 8081
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 200
    soft_limit = 150

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[checks]
  [checks.health]
    grace_period = "60s"
    interval = "15s"
    method = "GET"
    path = "/actuator/health"
    port = 8081
    timeout = "10s"
    type = "http"
