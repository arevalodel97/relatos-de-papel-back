app = "relatos-payments"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8082"
  SERVER_PORT = "8082"
  EUREKA_ENABLED = "true"
  DB_PORT = "3306"
  CATALOGUE_SERVICE_NAME = "ms-books-catalogue"

# Los secretos (EUREKA_URL, DB_HOST, DB_USERNAME, DB_PASSWORD, PAYMENTS_DB_NAME)
# se configuran con: fly secrets set VARIABLE=valor

[http_service]
  internal_port = 8082
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 200
    soft_limit = 150

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[checks]
  [checks.health]
    grace_period = "60s"
    interval = "15s"
    method = "GET"
    path = "/actuator/health"
    port = 8082
    timeout = "10s"
    type = "http"
