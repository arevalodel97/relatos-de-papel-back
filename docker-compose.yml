services:

  # ─── MySQL para payments ──────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: relatos-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${PAYMENTS_DB_NAME}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - relatos-net

  # ─── Eureka Server ────────────────────────────────────────────────────────
  eureka:
    build: ./eureka-server
    container_name: relatos-eureka
    ports:
      - "8761:8761"
    environment:
      SERVER_PORT: 8761
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - relatos-net

  # ─── ms-books-catalogue instancia 1 ──────────────────────────────────────
  catalogue-1:
    build: ./ms-books-catalogue
    container_name: relatos-catalogue-1
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      EUREKA_URL: http://eureka:8761/eureka/
      EUREKA_ENABLED: "true"
      OPENSEARCH_HOST: ${OPENSEARCH_HOST}
      OPENSEARCH_PORT: ${OPENSEARCH_PORT}
      OPENSEARCH_SCHEME: ${OPENSEARCH_SCHEME}
      OPENSEARCH_USERNAME: ${OPENSEARCH_USERNAME}
      OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD}
      OPENSEARCH_INDEX: ${OPENSEARCH_INDEX}
    depends_on:
      eureka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - relatos-net

  # ─── ms-books-catalogue instancia 2 ──────────────────────────────────────
  catalogue-2:
    build: ./ms-books-catalogue
    container_name: relatos-catalogue-2
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: 8083
      EUREKA_URL: http://eureka:8761/eureka/
      EUREKA_ENABLED: "true"
      OPENSEARCH_HOST: ${OPENSEARCH_HOST}
      OPENSEARCH_PORT: ${OPENSEARCH_PORT}
      OPENSEARCH_SCHEME: ${OPENSEARCH_SCHEME}
      OPENSEARCH_USERNAME: ${OPENSEARCH_USERNAME}
      OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD}
      OPENSEARCH_INDEX: ${OPENSEARCH_INDEX}
    depends_on:
      eureka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - relatos-net

  # ─── ms-books-payments instancia 1 ───────────────────────────────────────
  payments-1:
    build: ./ms-books-payments
    container_name: relatos-payments-1
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      EUREKA_URL: http://eureka:8761/eureka/
      EUREKA_ENABLED: "true"
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      PAYMENTS_DB_NAME: ${PAYMENTS_DB_NAME}
      CATALOGUE_SERVICE_NAME: ${CATALOGUE_SERVICE_NAME}
    depends_on:
      eureka:
        condition: service_healthy
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - relatos-net

  # ─── ms-books-payments instancia 2 ───────────────────────────────────────
  payments-2:
    build: ./ms-books-payments
    container_name: relatos-payments-2
    ports:
      - "8084:8084"
    environment:
      SERVER_PORT: 8084
      EUREKA_URL: http://eureka:8761/eureka/
      EUREKA_ENABLED: "true"
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      PAYMENTS_DB_NAME: ${PAYMENTS_DB_NAME}
      CATALOGUE_SERVICE_NAME: ${CATALOGUE_SERVICE_NAME}
    depends_on:
      eureka:
        condition: service_healthy
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - relatos-net

  # ─── API Gateway ──────────────────────────────────────────────────────────
  gateway:
    build: ./api-gateway
    container_name: relatos-gateway
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      EUREKA_URL: http://eureka:8761/eureka/
      EUREKA_ENABLED: "true"
      CATALOGUE_SERVICE_NAME: ${CATALOGUE_SERVICE_NAME}
      PAYMENTS_SERVICE_NAME: ${PAYMENTS_SERVICE_NAME}
      FRONTEND_URL: ${FRONTEND_URL}
    depends_on:
      eureka:
        condition: service_healthy
      catalogue-1:
        condition: service_healthy
      payments-1:
        condition: service_healthy
    networks:
      - relatos-net

volumes:
  mysql_data:

networks:
  relatos-net:
    driver: bridge
