app = "relatos-eureka"
primary_region = "ams"  # Ámsterdam — más cercano a España disponible

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8761"

[http_service]
  internal_port = 8761
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 200
    soft_limit = 150

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[checks]
  [checks.health]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/actuator/health"
    port = 8761
    timeout = "10s"
    type = "http"
